name: Build Q30 Pro (private/q30p)

on:
  push:
    branches:
      - private/q30p
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -hT /

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison \
            build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
            g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
            subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd \
            zlib1g-dev zstd
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"

      - name: Prepare feeds
        run: |
          cp feeds.conf.default feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify configuration
        run: |
          set -e
          test -f .config
          grep -E 'CONFIG_TARGET_PROFILE|CONFIG_TARGET_ROOTFS_PARTSIZE' .config
          missing=0
          for p in htop curl luci-theme-argon luci-app-ddns nano unzip \
                   coreutils openssh-sftp-server libnghttp2 libudns \
                   luci-app-mtwifi-cfg kmod-mt_wifi; do
            if ! grep -q "^CONFIG_PACKAGE_$p=y" .config; then
              echo "ERROR: CONFIG_PACKAGE_$p is missing from .config"
              missing=1
            fi
          done
          [ "$missing" = 0 ]
          echo "Configuration OK, building with the committed .config as-is"

      - name: Download sources
        run: make -j$(nproc) download || make -j1 download V=s

      - name: Build firmware
        run: make -j$(nproc)

      - name: List artifacts
        run: |
          find bin/targets -maxdepth 4 -type f \( -name '*.bin' -o -name '*.manifest' \) | sort

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: q30p-config
          path: .config

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: q30p-firmware
          path: |
            bin/targets/mediatek/filogic/*.bin
            bin/targets/mediatek/filogic/*.manifest
          if-no-files-found: error
